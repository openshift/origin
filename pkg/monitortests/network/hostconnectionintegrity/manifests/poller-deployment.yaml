apiVersion: apps/v1
kind: Deployment
metadata:
  name: host-connection-integrity-poller
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 34%
      maxSurge: 0
  # to be overridden by the number of nodes
  replicas: 1
  selector:
    matchLabels:
      network.openshift.io/host-connection-integrity: poller
  template:
    metadata:
      labels:
        network.openshift.io/host-connection-integrity: poller
    spec:
      containers:
        - command:
            - /usr/bin/openshift-tests
            - disruption
            - watch-established-connections
            - --my-node-name=$(MY_NODE_NAME)
            - --stop-configmap=stop-collecting
          # --peers, --control-plane-nodes and --api-int-url are appended at deployment time.
          image: image-to-be-replaced
          imagePullPolicy: IfNotPresent
          name: poller
          terminationMessagePolicy: FallbackToLogsOnError
          securityContext:
            runAsUser: 0
            privileged: true
          env:
            - name: MY_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
      restartPolicy: Always
      hostNetwork: true
      terminationGracePeriodSeconds: 10
      tolerations:
        - key: "node-role.kubernetes.io/master"
          operator: "Exists"
          effect: "NoSchedule"
        - key: "node-role.kubernetes.io/edge"
          operator: "Exists"
          effect: "NoSchedule"
        - key: "node-role.kubernetes.io/arbiter"
          operator: "Exists"
          effect: "NoSchedule"
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: "kubernetes.io/hostname"
              labelSelector:
                matchLabels:
                  network.openshift.io/host-connection-integrity: poller
