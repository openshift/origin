---
version: 2

project_name: loggercheck

release:
  github:
    owner: timonwong
    name: loggercheck
  mode: keep-existing

builds:
  - binary: loggercheck
    goos:
      - darwin
      - windows
      - linux
    goarch:
      - '386'
      - amd64
      - arm
      - arm64
    goarm:
      - '7'
    env:
      - CGO_ENABLED=0
    ignore:
      - goos: darwin
        goarch: '386'
      # windows/arm was removed from the Go toolchain.
      - goos: windows
        goarch: arm
    main: ./cmd/loggercheck/
    flags:
      - -trimpath
    ldflags: -s -w

archives:
  - name_template: '{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}'
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

snapshot:
  version_template: '{{ incpatch .Version }}-next'

checksum:
  name_template: 'checksums.txt'

changelog:
  disable: true
