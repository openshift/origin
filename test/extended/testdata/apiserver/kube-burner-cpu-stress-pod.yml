apiVersion: v1
kind: Pod
metadata:
  generateName: cpu-stress-
  namespace: kube-burner-stress
  labels:
    app: cpu-stress
spec:
  containers:
  - name: stress
    image: polinux/stress
    command: ["stress"]
    args: ["--cpu", "2", "--timeout", "DURATION_PLACEHOLDER"]
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
  restartPolicy: Never
